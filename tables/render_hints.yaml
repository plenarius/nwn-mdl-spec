# Render hint: the u32 at mesh header +116 (node +228) (CC0-1.0).
# Values are what SharedMaterial::ExtractRenderHint (0x4c5410) returns for
# the mesh's `renderhint` word, compared case-insensitively.
schema: mdl-spec/render_hints/1
build: 89.8193.37-17
values:
  - {value: 0, ascii: "(none given, or any other word)", tangents: false, status: confirmed, evidence: "zspec_hints hint_bogus, zspec_trimesh"}
  - {value: 1, ascii: None, tangents: false, status: confirmed, evidence: "zspec_hints hint_none"}
  - {value: 2, ascii: NormalAndSpecMapped, tangents: true, status: confirmed, evidence: "zspec_hint_mesh, zspec_hints hint_lower"}
  - {value: 3, ascii: NormalTangents, tangents: true, status: confirmed, evidence: "zspec_hints hint_tangents"}
# A mesh with no renderhint takes the hint of its material: the .mtr named
# by `materialname`, or the .mtr named by `bitmap` (MDL-MESH-041). Its hint
# field stays 0, but the tangents are generated and stored all the same.
from_material:
  - {via: materialname, field: 0, tangents: true, status: confirmed, evidence: cmtan01}
  - {via: bitmap, field: 0, tangents: true, status: confirmed, evidence: zspec_mtrbmp}
