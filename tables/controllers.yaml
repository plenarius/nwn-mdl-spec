# The emitter ids of the community compiler nwnmdlcomp where they differ
# from the game's. A binary from nwnmdlcomp is read by the game with the
# game's ids (the loader has no compiler switch, MDL-CTRL-011): its 464
# and 468 become percentStart and sizeMid, and 480-488 match nothing.
# Source: nwnmdlcomp NwnMdlNodes.h:168-174 (via Moonglow notes_models.md
# B.8) and cleanmodels controllers.go. No nwnmdlcomp binary was made for
# this suite (no nwnmdlcomp here): status inferred.
nwnmdlcomp_emitter:
  - {id: 464, name: alphaMid, game_id: 448, status: inferred}
  - {id: 468, name: colorMid, game_id: 452, status: inferred}
  - {id: 480, name: percentStart, game_id: 464, status: inferred}
  - {id: 481, name: percentMid, game_id: 465, status: inferred}
  - {id: 482, name: percentEnd, game_id: 466, status: inferred}
  - {id: 484, name: sizeMid, game_id: 468, status: inferred}
  - {id: 488, name: sizeMid_y, game_id: 472, status: inferred}
