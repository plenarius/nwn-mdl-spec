# NWN:EE binary controller IDs, by node class (CC0-1.0).
# Format: tables/README.md. Build: 89.8193.37-17 (nwmain-linux, commit 26c6e573).
#
# A controller is named by (node class, id): the same id means different
# things on different node types (100 is selfillumcolor on a mesh and
# verticaldisplacement on a light). Resolve in the order emitter, light,
# mesh, base, using the node flags (node_flags.yaml): emitter = 0x4,
# light = 0x2, mesh = 0x20, base = every node.
#
# columns: floats per key value (detonate: 0, time-only keys). A bezier
# key stores the value, then an in handle, then an out handle, each
# `columns` wide (MDL-CTRL-020).
# keyword: the engine's ASCII spelling (matched case-insensitively);
# `<keyword>key` and `<keyword>bezierkey` are the key-list forms.
# default: the value a decompiler may omit (only where known).
schema: mdl-spec/controllers/1
build: 89.8193.37-17
controllers:
  - {id: 8, name: position, applies: base, columns: 3, keyword: position, static: true, key: true, bezier: true, default: [0, 0, 0], status: confirmed, evidence: "zspec_dummy, zspec_anim, zspec_bezier2", note: "positionkey, positionbezierkey"}
  - {id: 20, name: orientation, applies: base, columns: 4, keyword: orientation, static: true, key: true, bezier: true, default: [0, 0, 0, 1], status: confirmed, evidence: "zspec_dummy, zspec_orient, zspec_anim; E34 for the bezier form", note: "orientationkey; orientationbezierkey is accepted but broken (MDL-CTRL-022)"}
