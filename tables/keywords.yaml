# Words found in ASCII models or written by tools that no engine parser
# reads. The engine skips them: an implementation that gives them a
# meaning makes a model the game does not show the same way.
not_read:
  - {word: setfillumcolor, where: trimesh, status: confirmed, evidence: zspec_setfill, note: "misspelling of selfillumcolor; 2,387 stock ASCII files carry it (Moonglow notes B.22c)"}
  - {word: lightningsubdiv, where: emitter, status: confirmed, evidence: "zspec_emitter, zspec_animfx (lightningsubdivkey)"}
  - {word: opacity, where: emitter, status: confirmed, evidence: zspec_emitter}
  - {word: ambient_only, where: light, status: confirmed, evidence: "zspec_light lamp_b"}
  - {word: fading_light, where: light, status: confirmed, evidence: "zspec_light lamp_b"}
  - {word: negativelight, where: light, status: confirmed, evidence: "zspec_light lamp_b (no header field changed)"}
  - {word: lensflares, where: light, status: confirmed, evidence: "zspec_light lamp_b"}
  - {word: n_dynamic_type, where: light, status: inferred, evidence: "absent from MdlNodeLight::InternalParseField 0x44baf0"}
  - {word: affect_dynamic, where: light, status: inferred, evidence: "absent from 0x44baf0"}
  - {word: texture3, where: trimesh, status: inferred, evidence: "absent from 0x44ced0 (slot 3 is materialname)"}
  - {word: lightmapped, where: trimesh, status: inferred, evidence: "absent from 0x44ced0; the binary byte holds uninitialised data (MDL-BIN-051)"}
  - {word: center, where: trimesh, status: inferred, evidence: "absent from 0x44ced0"}
  - {word: gizmo, where: trimesh, status: inferred, evidence: "absent from 0x44ced0"}
  - {word: multimaterial, where: aabb, status: inferred, evidence: "absent from 0x44ced0 and 0x44dba0"}
  - {word: walkmesh, where: aabb, status: inferred, evidence: "absent from 0x44dba0"}
  - {word: filedependency, where: top, status: inferred, evidence: "0x446330 knows only filedependancy"}
  - {word: "update_sel, render_sel, blend_sel, spawntype_sel, p2p_type, m_istnited", where: emitter, status: inferred, evidence: "absent from MdlNodeEmitter::InternalParseField 0x449090"}
  - {word: "clipu, clipv, clipw, cliph", where: animmesh, status: inferred, evidence: "absent from 0x44daf0 and 0x44ced0"}
  - {word: "texture4 ... texture14", where: trimesh, status: inferred, evidence: "absent from 0x44ced0"}
  - {word: PARENT, where: base, status: confirmed, evidence: "zspec_numbers n_caps", note: "parent is matched case-sensitively"}
