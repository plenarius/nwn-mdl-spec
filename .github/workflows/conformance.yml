# SPDX-License-Identifier: CC0-1.0
# Self-checks on every push; the implementations' runs are reports, not gates
# (see conformance/reports/).
# Regenerating the goldens needs the game and an X server, so it is not
# done here: see CONTRIBUTING.md (a self-hosted runner with the game could
# run conformance/tools/make_goldens.py and `mdlconf.py check-goldens`).
name: conformance
on: [push, pull_request]
jobs:
  selfcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install pyyaml
      - run: python3 runner/selfcheck.py
  kaitai:
    # The .ksy compiled with the real kaitai-struct-compiler, and every golden
    # decoded with the generated parser (ksy/README.md).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - run: |
          curl -sSL -o ksc.zip https://github.com/kaitai-io/kaitai_struct_compiler/releases/download/0.11/kaitai-struct-compiler-0.11.zip
          unzip -q ksc.zip -d /tmp
          /tmp/kaitai-struct-compiler-0.11/bin/kaitai-struct-compiler -t python --outdir /tmp/ksc-out ksy/nwn_mdl.ksy
          pip install kaitaistruct
          python3 ksy/check_ksy.py --generated /tmp/ksc-out
  cleanmodels:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version: '1.26'}
      - run: go install github.com/plenarius/cleanmodels/cmd/cleanmodels@latest
      - run: python3 runner/mdlconf.py run --impl cleanmodels --cmd runner/adapters/cleanmodels.sh --json cleanmodels.json
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: cleanmodels-report, path: cleanmodels.json}
  moonglow:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with: {repository: jadzziaa/moonglow-toolset, path: moonglow-toolset}
      - uses: dtolnay/rust-toolchain@stable
      - run: runner/adapters/moonglow/build.sh moonglow-toolset /tmp/mdlspec-mgconf
      - run: python3 runner/mdlconf.py run --impl moonglow --cmd runner/adapters/moonglow.sh --json moonglow.json
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: moonglow-report, path: moonglow.json}
